<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AthletX — Login (Lo-Fi)</title>
  <link rel="stylesheet" href="lofi.css">
  <style>
    .auth-bg {
      min-height: 100vh;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: #f5f5f5;
      border: 1px solid #c8c8c8;
      border-radius: 2px;
      width: 380px;
      padding: 40px;
    }

    .auth-logo {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .auth-tagline {
      font-size: 12px;
      color: #888;
      margin-bottom: 32px;
    }

    .auth-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #666;
      margin-bottom: 6px;
      display: block;
    }

    .auth-input {
      width: 100%;
      height: 36px;
      background: #e8e8e8;
      border: 1px solid #bbb;
      border-radius: 2px;
      margin-bottom: 18px;
    }

    .auth-btn {
      width: 100%;
      height: 38px;
      background: #aaa;
      border: 1px solid #888;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 700;
      color: #222;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    .auth-link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }

    .auth-link:hover { color: #333; }

    .auth-divider {
      border: none;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }

    .auth-footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="auth-bg">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">AthletX Admin</div>
      <div class="auth-tagline">Sign in to your admin account</div>

      <!-- Form -->
      <label class="auth-label">Email Address</label>
      <div class="auth-input"></div>

      <label class="auth-label">Password</label>
      <div class="auth-input"></div>

      <div class="auth-btn"></div>

      <a class="auth-link" href="forgot-password.html">Forgot your password?</a>

      <hr class="auth-divider">

      <div class="auth-footer">AthletX Admin Portal &nbsp;·&nbsp; v2.4.1</div>
    </div>
  </div>

</body>
</html>
