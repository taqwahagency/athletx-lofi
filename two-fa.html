<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AthletX — Two-Factor Auth (Lo-Fi)</title>
  <link rel="stylesheet" href="lofi.css">
  <style>
    .auth-bg {
      min-height: 100vh;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: #f5f5f5;
      border: 1px solid #c8c8c8;
      border-radius: 2px;
      width: 380px;
      padding: 40px;
    }

    .auth-logo {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      margin-bottom: 6px;
    }

    .auth-tagline {
      font-size: 12px;
      color: #888;
      margin-bottom: 32px;
    }

    .auth-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #666;
      margin-bottom: 6px;
      display: block;
    }

    .auth-btn {
      width: 100%;
      height: 38px;
      background: #aaa;
      border: 1px solid #888;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 700;
      color: #222;
      margin-top: 6px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }

    .auth-link:hover { color: #333; }

    .auth-divider {
      border: none;
      border-top: 1px solid #ddd;
      margin: 20px 0;
    }

    .auth-footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 8px;
    }

    .info-box {
      background: #e8e8e8;
      border: 1px solid #ccc;
      border-radius: 2px;
      padding: 12px 14px;
      font-size: 12px;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 6-digit code boxes */
    .code-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .code-box {
      flex: 1;
      height: 48px;
      background: #e8e8e8;
      border: 1px solid #bbb;
      border-radius: 2px;
    }

    .resend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #888;
      margin-bottom: 20px;
    }

    .resend-link {
      font-size: 11px;
      color: #666;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="auth-bg">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">AthletX Admin</div>
      <div class="auth-tagline">Two-factor authentication</div>

      <!-- Info -->
      <div class="info-box">
        A 6-digit verification code was sent to your email address ending in ••••@gmail.com
      </div>

      <!-- Code entry -->
      <label class="auth-label">Verification Code</label>
      <div class="code-row">
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
        <div class="code-box"></div>
      </div>

      <div class="resend-row">
        <span>Code expires in 4:58</span>
        <a class="resend-link" href="#">Resend code</a>
      </div>

      <div class="auth-btn">Verify & Sign In</div>

      <a class="auth-link" href="login.html">← Back to Sign In</a>

      <hr class="auth-divider">

      <div class="auth-footer">AthletX Admin Portal &nbsp;·&nbsp; v2.4.1</div>
    </div>
  </div>

</body>
</html>
